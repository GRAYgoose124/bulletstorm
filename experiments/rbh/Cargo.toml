[package]
name = "rbh"
version = "0.1.0"
edition = "2021"

[dependencies]
arr_macro = "0.2.1"
cstr = "0.2.12"
rand = "0.8.5"
raylib = "5.0.1"
rayon = "1.10.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"